<li class="course">
  <span class="course-year">{{ c.year }}</span>
  <div class="course-body">
    <h3 class="course-title">{{ c.course }} <span class="course-hours">{{ c.hours }}h</span></h3>
    <p class="course-meta">{{ c.role }} · {{ c.level }}</p>
    <p class="course-meta">{{ c.institution }}, {{ c.location }}</p>
  </div>
</li>
