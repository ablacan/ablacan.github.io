---
layout: base
---

<div class="home">
  {{ content }}

  <section class="updates" aria-labelledby="updates-heading">
    <h2 id="updates-heading" class="updates-heading">Updates</h2>
    <ul class="updates-list">
      {%- for item in site.data.news %}
      <li>
        <span class="updates-when">{{ item.when }}</span>
        <span class="updates-text">{{ item.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}
          {%- if item.link %} <a href="{{ item.link }}" target="_blank" rel="noopener">→</a>{% endif %}</span>
      </li>
      {%- endfor %}
    </ul>
  </section>
</div>
